<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body>
    
     
    <main>
        <div class="header1">
         <div class="brand">
            <div class="logo" style="padding-top:1.3rem;" >
            <img class="menuLogo h-5 w-5 hidden" src="assets/icon-menu.svg" />
            <img class="mainLogo" src="assets/logo.svg" />
            </div>
            
            <div class="nav">
                <a class="collections" href="#">Collections</a>
                <a class="men" href="#">Men</a>
                <a class="women" href="#">Women</a>
                <a class="about" href="#">About</a>
                <a class="contact" href="#">Contact</a>              
            </div>
         </div>

        <div class="cart">
          <img class="sideCart" style="width: 1rem; height: 1rem; cursor: pointer;margin-top: 10px;"  src="assets/icon-cart.svg" />
          <img style="width: 2rem; height: 2rem; cursor: pointer; box-sizing: border-box;  " class="img1" src="assets/image-avatar.png" />          
        </div>     
    </div>
</main>
     <div class="main">
        <div class="section1">
          <div class="images">   
           <img class="mainImage" src="assets/image-product-1.jpg" /> 
           </div>       
            <div class="thumbnail">
                <img class="thumbImage" src="assets/image-product-1-thumbnail.jpg" />
                <img class="thumbImage" src="assets/image-product-2-thumbnail.jpg" />
                <img class="thumbImage" src="assets/image-product-3-thumbnail.jpg" />
                <img class="thumbImage" src="assets/image-product-4-thumbnail.jpg" />
            </div>       
        </div>
        
        <div class="section2">
           
             <div class="header">
             <h6 class="text-gray-500 font-semibold ">SNEAKER COMPANY</h6>
             <h1 class="text-5xl  font-semibold -translate-y-4 ">Fall Limited Edition Sneakers</h1>
            <p  class="text w-120 text-lg text-gray-400 -translate-y-2 tracking-wide ">These low-profile sneakers are your perfect casual wear companion.
                 Featuring a durable rubber outer sole, they'll withstand everything
                  the weather can offer.
            </p>
             </div>
            
            <div class="mainRate ">
                <div class="rate ">
             <span style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: xx-large; font-weight: bolder;">$125.00</span> 
             <span style=" background-color: rgb(15, 20, 5); color: white; border-radius: 5px; padding: 0 10px 0 10px; font-weight:500; font-size:larger; font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">50%</span>
            <div class="discount">
            <p style="text-decoration: line-through; color: rgb(126, 126, 126); font-weight: 700;">$250.00</p>
           </div>
            </div>
            </div>
           
            
           <form class="btns translate-y-5" >
                
             <div class="btn1" >
                <span class="decrease" style="border: none;">
                <img src="assets/icon-minus.svg" />
                </span>
               <span class="count"  style="background-color:#f0f0f0;font-size:medium; font-weight:900;font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">0</span>
               <span class="increase" style="border: none;">
                <img src="assets/icon-plus.svg" />
               </span>
             </div>
             <buttton class="cartBtn cursor-pointer"><img style="height: 20px; width: 30px;"  src="assets/icons8-shopping-cart-32.png" /> Add to cart</buttton>
           </form>
        
    </div>
     </div>
        
    
    

    <script src="app.js"></script>
</body>
</html>
